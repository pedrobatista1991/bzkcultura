<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>BZK Cultura</title>
  <style>
    body {
      background-color: white;
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Logo centralizada */
    .logo {
      margin-top: 20px;
      max-width: 120px;
    }

    /* Área principal */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .main h1 {
      margin: 20px 0 10px 0;
      font-size: 28px;
    }

    .main p {
      margin: 0;
      font-size: 18px;
      color: #555;
    }

    /* Botões padrão (desktop) */
    .buttons {
      position: absolute;
      right: 20px;
      top: 120px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .buttons a {
      background-color: #A0522D; /* marrom claro */
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      margin: 8px 0;
      width: 180px;
      text-align: center;
      border-radius: 6px;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .buttons a:hover {
      background-color: #8B4513;
    }

    /* Responsividade para smartphones */
    @media (max-width: 768px) {
      .buttons {
        position: static;
        flex-direction: column;
        align-items: center;
        margin-top: 20px;
      }

      .buttons a {
        width: 90%; /* ocupa quase toda a largura da tela */
        font-size: 18px;
      }

      .logo {
        max-width: 100px;
      }

      .main h1 {
        font-size: 22px;
      }

      .main p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- Logo -->
  <img src="logo.png" alt="Logo BZK Cultura" class="logo">

  <!-- Área principal -->
  <div class="main">
    <h1>Bem-vindo à BZK Cultura</h1>
    <p>Site em construção</p>
  </div>

  <!-- Botões -->
  <div class="buttons">
    <a href="#">QUEM SOMOS</a>
    <a href="#">PRODUTOS</a>
    <a href="#">NOSSA MISSÃO</a>
    <a href="#">AÇÕES</a>
    <a href="#">ORÇAMENTOS</a>
  </div>
</body>
</html>
