<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Atualizado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      color: #333;
    }

    header {
      background-color: #2750F5;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    nav {
      background-color: #1e3ec9;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      padding: 20px;
      text-align: center;
    }

    /* ESTILO DOS BOTÕES */
    button, .btn {
      background-color: #2750F5 !important;
      color: #ffffff !important;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
      display: inline-block;
      margin: 10px;
    }

    button:hover, .btn:hover {
      background-color: #1e3ec9 !important;
    }

    footer {
      background-color: #2750F5;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }

    /* GALERIA DE IMAGENS */
    .galeria {
      display: flex;
      flex-wrap: wrap;          /* quebra linha se não couber */
      justify-content: center;  /* centraliza na tela */
      gap: 15px;                /* espaço entre imagens */
      margin-top: 30px;
    }

    .galeria img {
      width: 150px;             /* tamanho fixo */
      height: auto;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.3s;
    }

    .galeria img:hover {
      transform: scale(1.1);    /* efeito zoom */
    }
  </style>
</head>
<body>
  <header>
    <h1>Bem-vindo ao Meu Site</h1>
  </header>

  <nav>
    <a href="#">Início</a>
    <a href="#">Serviços</a>
    <a href="#">Contato</a>
  </nav>

  <main>
    <h2>Atualização Visual</h2>
    <p>Agora com botões azuis e imagens modernas!</p>
    <button>Saiba Mais</button>
    <button>Entre em Contato</button>
    <a href="#" class="btn">Botão Link</a>

    <!-- GALERIA DE IMAGENS -->
    <div class="galeria">
      <img src="images/1.png" alt="Imagem 1">
      <img src="images/2.png" alt="Imagem 2">
      <img src="images/3.png" alt="Imagem 3">
      <img src="images/4.png" alt="Imagem 4">
      <img src="images/5.png" alt="Imagem 5">
      <img src="images/6.png" alt="Imagem 6">
      <img src="images/7.png" alt="Imagem 7">
      <img src="images/8.png" alt="Imagem 8">
      <img src="images/9.png" alt="Imagem 9">
      <img src="images/10.png" alt="Imagem 10">
      <img src="images/11.png" alt="Imagem 11">
      <img src="images/12.png" alt="Imagem 12">
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Meu Site - Todos os direitos reservados</p>
  </footer>
</body>
</html>
