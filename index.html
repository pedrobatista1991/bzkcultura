<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Atualizado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      color: #333;
    }

    header {
      background-color: #2750F5;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    nav {
      background-color: #1e3ec9;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      padding: 20px;
      text-align: center;
    }

    /* ESTILO DOS BOTÕES */
    button, .btn {
      background-color: #2750F5 !important; /* força o azul */
      color: #ffffff !important;           /* texto branco */
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
      display: inline-block;
      margin: 10px;
    }

    button:hover, .btn:hover {
      background-color: #1e3ec9 !important; /* tom mais escuro no hover */
    }

    footer {
      background-color: #2750F5;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bem-vindo ao Meu Site</h1>
  </header>

  <nav>
    <a href="#">Início</a>
    <a href="#">Serviços</a>
    <a href="#">Contato</a>
  </nav>

  <main>
    <h2>Atualização Visual</h2>
    <p>Agora com botões azuis e imagens modernas!</p>
    <button>Saiba Mais</button>
    <button>Entre em Contato</button>
    <a href="#" class="btn">Botão Link</a>

    <img src="https://via.placeholder.com/800x400.png?text=Imagem+de+Destaque" alt="Imagem de destaque">
  </main>

  <footer>
    <p>&copy; 2026 Meu Site - Todos os direitos reservados</p>
  </footer>
</body>
</html>
